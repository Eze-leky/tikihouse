<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiki House Bar - Carta</title>
    <meta name="description" content="Carta de Tiki House Bar - La Plata. Cócteles tropicales, comidas y bebidas.">

    <!-- Redirección automática server-side (funciona aunque JS esté deshabilitado) -->
    <meta http-equiv="refresh" content="0; url=https://tikihouse.com.ar/carta/">

    <!-- SEO: avisar a buscadores que la URL canónica es la nueva -->
    <link rel="canonical" href="https://tikihouse.com.ar/carta/">

    <!-- Redirección JS instantánea (más rápido que meta refresh) -->
    <script>
        // window.location.replace() no agrega al historial:
        // si el usuario hace "atrás" vuelve a donde estaba antes del QR, no a esta página
        window.location.replace('https://tikihouse.com.ar/carta/');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .wrap { max-width: 500px; }
        .moai {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: bob 2s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FF6B9D, #FFC107, #00D4AA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p { font-size: 1rem; opacity: 0.7; margin-bottom: 1.5rem; line-height: 1.5; }
        .link {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #FF6B9D, #FF4E50);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .link:hover { transform: translateY(-2px); }
        .small { font-size: 0.85rem; opacity: 0.5; margin-top: 2rem; }
    </style>
</head>
<body>
    <!--
      Si llegaste a ver esta pantalla, es porque tu navegador
      no ejecutó el redirect automático. Usá el botón de abajo.
    -->
    <div class="wrap">
        <div class="moai">🗿</div>
        <h1>Tiki House Bar</h1>
        <p>Si no te redirige automáticamente, tocá el botón:</p>
        <a href="https://tikihouse.com.ar/carta/" class="link">Ver la Carta 🍹</a>
        <p class="small">tikihouse.com.ar/carta/</p>
    </div>
</body>
</html>
